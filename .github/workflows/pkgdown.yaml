# Build the pkgdown site and deploy it to the gh-pages branch. Standard r-lib
# workflow, except that the site builds into pkgdown-site/ (see _pkgdown.yml):
# docs/ holds the design memo, and build_site_github_pages() refuses to clean
# a non-empty docs/ that pkgdown did not create. dest_dir and the deploy
# folder must name the same directory. Enable GitHub Pages (Settings -> Pages
# -> Source: gh-pages) once the branch exists after the first run.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every top-level .md file into a page and lists it in
      # sitemap.xml and the site search, and it ignores .Rbuildignore when
      # doing so. Delete the instruction files from this throwaway checkout
      # so they do not appear on the public site.
      - name: Remove project-instruction files from the site source
        run: rm -f CLAUDE.md CLAUDE_CODING.md POINT.md

      - name: Build site
        run: pkgdown::build_site_github_pages(dest_dir = "pkgdown-site", new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: pkgdown-site
